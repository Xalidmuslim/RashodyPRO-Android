name: Android Debug APK
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=${ANDROID_HOME}"
          SDKMANAGER=$(find "${ANDROID_HOME}/cmdline-tools" -type f -name sdkmanager | head -n 1)
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0"
      - name: Install and generate Android project
        run: |
          python3 -m pip install --break-system-packages Pillow
          npm install
          npm run verify
          npx cap add android
          node scripts/prepare-android.mjs
          npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Rashody-PRO-debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish one-time direct APK download
        if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[publish-apk]') }}
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cp android/app/build/outputs/apk/debug/app-debug.apk RashodyPRO-DeepMatte-v5.1.apk
          gh release create deep-matte-v5.1 "RashodyPRO-DeepMatte-v5.1.apk" \
            --target "$GITHUB_SHA" \
            --title "Расходы PRO — Deep Matte v5.1" \
            --notes "Прямая загрузка APK без входа в GitHub. Это debug-сборка: перед установкой сохраните JSON-копию расходов. Если подпись не совпадает, не удаляйте текущую версию до резервного копирования." \
            --latest
