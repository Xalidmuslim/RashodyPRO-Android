name: Rashody PRO Studio v7.4 Contrast & Depth Review and APK
on:
  push:
    branches: [redesign/rashody-v74-contrast-depth-audit-2026-10-31]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  studio-android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify v7.4 visual contrast, motion, finance behavior and icons
        run: |
          set -euo pipefail
          python3 -m pip install --break-system-packages Pillow
          npm install
          npm run verify
      - name: Install Android build platform
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0"
      - name: Prepare isolated v7.4 Android preview
        run: |
          set -euo pipefail
          npx cap add android
          node scripts/prepare-android.mjs
          npx cap sync android
          node scripts/build-contrast-v74.mjs
          node scripts/verify-contrast-preview-v74.mjs
      - name: Compile Android APK
        working-directory: android
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Verify APK identity, assets, ZIP integrity and untouched sources
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | grep "package: name='ru.rashody.pro.preview74'"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | grep "versionName='7.4-studio-matte-preview'"
          unzip -t "$APK" >/dev/null
          unzip -p "$APK" assets/public/index.html | grep -q 'studio-v70.css'
          unzip -p "$APK" assets/public/studio-v70.css | grep -q 'Studio v7.4'
          unzip -p "$APK" assets/public/premium-motion-v73.js | grep -q 'requestAnimationFrame'
          sha256sum "$APK"
          git diff --exit-code -- www native package.json
      - uses: actions/upload-artifact@v4
        with:
          name: RashodyPRO-Studio-v74-TEST-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
          if-no-files-found: error
      - name: Publish direct mobile APK
        if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[publish-v74]') }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cp android/app/build/outputs/apk/debug/app-debug.apk RashodyPRO-Studio-v7.4-Contrast-TEST.apk
          if gh release view rashody-studio-v7.4-contrast-test >/dev/null 2>&1; then
            gh release upload rashody-studio-v7.4-contrast-test RashodyPRO-Studio-v7.4-Contrast-TEST.apk --clobber
          else
          gh release create rashody-studio-v7.4-contrast-test RashodyPRO-Studio-v7.4-Contrast-TEST.apk \
            --target "$GITHUB_SHA" \
            --title "Расходы PRO — Studio Matte Contrast v7.4 (тест)" \
            --notes "Тестовая переработка четырёх основных экранов после визуальной критики v7.3: тёплая светлая поверхность вместо серого налёта, контрастная типографика, различимые матовые категории, единая система скруглений и контактных теней, выразительная основная кнопка и нижняя навигация. Premium Motion v7.3 сохранён. SQLite и финансовые расчёты не изменялись. Устанавливается отдельно: ru.rashody.pro.preview74. Визуальное тестирование на физическом Android ещё требуется." \
            --prerelease --latest=false
          fi
