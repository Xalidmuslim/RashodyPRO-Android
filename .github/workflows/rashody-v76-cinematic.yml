name: Rashody PRO v7.6 Tactile PNG & Motion APK
on:
  push:
    branches: [redesign/rashody-v76-cinematic-calendar-charts-2026-10-31]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  android-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Generate PNG assets and run regression suite
        run: |
          set -euo pipefail
          python3 -m pip install --break-system-packages Pillow
          npm install
          npm run verify
      - name: Install Android SDK 36
        run: |
          set -euo pipefail
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0"
      - name: Prepare isolated Android app and PNG assets
        run: |
          set -euo pipefail
          npx cap add android
          node scripts/prepare-android.mjs
          npx cap sync android
          node scripts/build-studio-v76.mjs
      - name: Compile Android debug APK
        working-directory: android
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Check built APK and packaged icon PNGs
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | grep "package: name='ru.rashody.pro.preview76'"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | grep "versionName='7.5-studio-matte-preview'"
          unzip -t "$APK" >/dev/null
          unzip -l "$APK" | grep -q 'assets/public/assets/icons/categories/food.png'
          unzip -l "$APK" | grep -q 'assets/public/assets/icons/nav/dashboard.png'
          unzip -l "$APK" | grep -q 'assets/public/assets/icons/actions/backspace.png'
          unzip -p "$APK" assets/public/index.html | grep -q 'studio-v76.css'
          sha256sum "$APK"
          git diff --exit-code -- www native package.json
      - uses: actions/upload-artifact@v4
        with:
          name: RashodyPRO-Studio-v76-3D-PNG-TEST-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
          if-no-files-found: error
      - name: Publish direct APK download
        if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[publish-v76]') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cp android/app/build/outputs/apk/debug/app-debug.apk RashodyPRO-Studio-v7.6-CINEMATIC-TEST.apk
          if gh release view rashody-studio-v7.6-cinematic-preview >/dev/null 2>&1; then
            gh release upload rashody-studio-v7.6-cinematic-preview RashodyPRO-Studio-v7.6-CINEMATIC-TEST.apk --clobber
          else
            gh release create rashody-studio-v7.6-cinematic-preview RashodyPRO-Studio-v7.6-CINEMATIC-TEST.apk \
              --target "$GITHUB_SHA" \
              --title "Расходы PRO — v7.6 Cinematic Matte Motion (тест)" \
              --notes "Cinematic 3D calendar 7-day cascade, staggered 3 metrics and 2s SVG donut draws with reduced-motion support. Isolated ru.rashody.pro.preview76. Real-device QA required." \
              --prerelease --latest=false
          fi
