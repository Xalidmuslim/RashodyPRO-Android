name: Rashody PRO v7.7 Sculpted Matte Motion APK
on:
  push:
    branches: [redesign/rashody-v77-sculpted-matte-motion-2026-10-31]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  android-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Generate PNG assets and immersive motion tests
        run: |
          set -euo pipefail
          python3 -m pip install --break-system-packages Pillow
          npm install
          npm run verify
      - name: Install Android SDK 36
        run: |
          set -euo pipefail
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0"
      - name: Prepare isolated Android app and PNG assets
        run: |
          set -euo pipefail
          npx cap add android
          node scripts/prepare-android.mjs
          npx cap sync android
          node scripts/build-studio-v77.mjs
      - name: Compile Android debug APK
        working-directory: android
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Check built APK and packaged icon PNGs
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | grep "package: name='ru.rashody.pro.preview77'"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | grep "versionName='7.7-studio-matte-preview'"
          unzip -t "$APK" >/dev/null
          unzip -l "$APK" | grep -q 'assets/public/assets/icons/categories/food.png'
          unzip -l "$APK" | grep -q 'assets/public/assets/icons/nav/dashboard.png'
          unzip -l "$APK" | grep -q 'assets/public/assets/icons/actions/backspace.png'
          unzip -l "$APK" | grep -q 'assets/public/assets/icons/kpi/kpi-wallet.png'
          unzip -l "$APK" | grep -q 'assets/public/assets/icons/kpi/kpi-receipt.png'
          unzip -l "$APK" | grep -q 'assets/public/assets/icons/kpi/kpi-bag.png'
          unzip -p "$APK" assets/public/index.html | grep -q 'studio-v77.css'
          unzip -p "$APK" assets/public/index.html | grep -q 'sculpted-motion-v77.js'
          sha256sum "$APK"
          git diff --exit-code -- www native package.json
      - uses: actions/upload-artifact@v4
        with:
          name: RashodyPRO-Studio-v77-Sculpted-Matte-TEST-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
          if-no-files-found: error
      - name: Publish direct APK download
        if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[publish-v77]') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cp android/app/build/outputs/apk/debug/app-debug.apk RashodyPRO-Studio-v7.7-Sculpted-Matte-TEST.apk
          if gh release view rashody-studio-v7.7-sculpted-matte-motion-preview >/dev/null 2>&1; then
            gh release upload rashody-studio-v7.7-sculpted-matte-motion-preview RashodyPRO-Studio-v7.7-Sculpted-Matte-TEST.apk --clobber
          else
            gh release create rashody-studio-v7.7-sculpted-matte-motion-preview RashodyPRO-Studio-v7.7-Sculpted-Matte-TEST.apk \
              --target "$GITHUB_SHA" \
              --title "Расходы PRO — v7.7 Grand Motion & Compact Calculator (тест)" \
              --notes "3 interactive sculpted KPI detail cards, expanded category donut, calendar wave, 0.8s sector reveal, animated analytics trend bars; 29 transparent PNG assets packaged. Isolated ru.rashody.pro.preview77. Device QA remains required." \
              --prerelease --latest=false
          fi
