name: Spec Kit v5.9 isolated preview QA

on:
  push:
    branches:
      - experiment/spec-kit-rashodypro-v59-2026-10-31
    paths:
      - .github/workflows/spec-kit-v59-qa.yml

permissions:
  contents: read

jobs:
  test:
    if: github.ref == 'refs/heads/experiment/spec-kit-rashodypro-v59-2026-10-31'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify current v5.9 sources
        run: |
          set -euo pipefail
          python3 -m pip install --break-system-packages Pillow
          npm install
          npm run verify
      - name: Install required Android SDK packages
        run: |
          set -euo pipefail
          SDKMANAGER=$(find "${ANDROID_HOME}/cmdline-tools" -type f -name sdkmanager | head -n 1)
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0"
      - name: Generate disposable v5.9 preview only
        run: |
          set -euo pipefail
          npx cap add android
          node scripts/prepare-android.mjs
          npx cap sync android
          node scripts/build-matte-preview-v57.mjs
      - name: Assemble test APK
        working-directory: android
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Validate package, artifact and source preservation
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "${ANDROID_HOME}/build-tools/36.0.0/aapt" dump badging "$APK" | grep "package: name='ru.rashody.pro.preview59'"
          sha256sum "$APK"
          git diff --exit-code -- www native package.json
      - uses: actions/upload-artifact@v4
        with:
          name: RashodyPRO-SpecKit-v59-SAFE-PREVIEW
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
