name: Rashody PRO v9.6 Approved Premium Matte Dashboard APK
on:
  push:
    branches: [feat/rashody-v96-matte-dashboard-approved-2026-11-03]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  android-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Generate PNG assets and immersive motion tests
        run: |
          set -euo pipefail
          python3 -m pip install --break-system-packages Pillow
          npm install
          npm run verify
          node scripts/verify-reference-v78.mjs
          node scripts/verify-reference-v79.mjs
          node scripts/verify-runtime-clean-v80.mjs
          node scripts/verify-premium-v81.mjs
          node scripts/verify-reference-v82.mjs
          node scripts/verify-reference-v83.mjs
          node scripts/verify-week-first-v84.mjs
          node scripts/verify-interactions-v85.mjs
          node scripts/verify-expressive-v86.mjs
          node scripts/verify-polish-v87.mjs
          node scripts/verify-shared-motion-v88.mjs
          node scripts/verify-motion-v90.mjs
          node scripts/verify-motion-v91.mjs
          node scripts/verify-nav-dock-v92.mjs
          node scripts/verify-nav-dock-v93.mjs
          node scripts/verify-detached-rows-v94.mjs
          node scripts/verify-rows-only-v95.mjs
          node scripts/verify-dashboard-v96.mjs
      - name: Install Android SDK 36
        run: |
          set -euo pipefail
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0"
      - name: Prepare isolated Android app and PNG assets
        run: |
          set -euo pipefail
          npx cap add android
          node scripts/prepare-android.mjs
          node scripts/bundle-runtime-theme-v80.mjs
          npx cap sync android
          node scripts/build-studio-v96.mjs
      - name: Compile Android debug APK
        working-directory: android
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Check built APK and packaged icon PNGs
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | grep "package: name='ru.rashody.pro.preview96'"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | grep "versionName='9.6-studio-matte-preview'"
          unzip -t "$APK" >/dev/null
          unzip -l "$APK" | grep -q 'assets/public/assets/icons/categories/food.png'
          unzip -l "$APK" | grep -q 'assets/public/assets/icons/nav/dashboard.png'
          unzip -l "$APK" | grep -q 'assets/public/assets/icons/actions/backspace.png'
          unzip -l "$APK" | grep -q 'assets/public/assets/icons/kpi/kpi-wallet.png'
          unzip -l "$APK" | grep -q 'assets/public/assets/icons/kpi/kpi-receipt.png'
          unzip -l "$APK" | grep -q 'assets/public/assets/icons/kpi/kpi-bag.png'
          unzip -l "$APK" | grep -q 'assets/public/assets/icons/kpi/kpi-coins.png'
          unzip -l "$APK" | grep -q 'assets/public/r80-theme.css'
          unzip -p "$APK" assets/public/r80-theme.css | grep -q 'WEEK FIRST / FACTORY SVG'
          unzip -p "$APK" assets/public/r80-theme.css | grep -q 'v8.5 — Single-icon surfaces'
          unzip -l "$APK" | grep -q 'assets/public/r86-expressive-motion.js'
          unzip -l "$APK" | grep -q 'assets/public/nav-dock-stability-v92.js'
          unzip -p "$APK" assets/public/nav-dock-stability-v92.js | grep -q 'const horizontalFrame='
          unzip -p "$APK" assets/public/sculpted-motion-v77.js | grep -q 'r95-rows-only-stack'
          unzip -p "$APK" assets/public/r80-theme.css | grep -q 'r95-rows-only-row'
          unzip -p "$APK" assets/public/r80-theme.css | grep -q 'SOURCE: r96-dashboard.css'
          unzip -p "$APK" assets/public/index.html | grep -q 'function dashboardV96()'
          unzip -p "$APK" assets/public/r80-theme.css | grep -q 'Rashody v8.6'
          unzip -p "$APK" assets/public/r80-theme.css | grep -q 'v8.7 — selected custom category'
          unzip -p "$APK" assets/public/index.html | grep -q 'const factoryCategories='
          unzip -p "$APK" assets/public/r80-theme.css | grep -q 'RASHODY PRO 8.1'
          unzip -l "$APK" | grep -q 'assets/public/r78-runtime.js'
          unzip -l "$APK" | grep -q 'assets/public/assets/brand/native-launcher.png'
          unzip -p "$APK" assets/public/r80-theme.css | grep -q '8.2 — Reference color/typography pass'
          for old in r78-header.css r78-hero.css r78-details.css r79-visual-qa.css r81-premium.css r82-refinement.css r84-clean-motion.css r85-interactions.css r86-expressive.css r87-polish.css; do
            if unzip -Z1 "$APK" | grep -Fq "assets/public/$old"; then echo "Unused theme fragment packaged: $old"; exit 1; fi
          done
          unzip -p "$APK" assets/public/index.html | grep -q 'studio-v77.css'
          unzip -p "$APK" assets/public/index.html | grep -q 'sculpted-motion-v77.js'
          sha256sum "$APK"
          git diff --exit-code -- www native package.json
      - name: Publish directly installable v9.6 APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cp android/app/build/outputs/apk/debug/app-debug.apk RashodyPRO-v9.6-Premium-Dashboard-TEST.apk
          TAG=rashody-studio-v9.6-approved-dashboard-preview
          APK=RashodyPRO-v9.6-Premium-Dashboard-TEST.apk
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
          else
            gh release create "$TAG" "$APK" --target "$GITHUB_SHA" --title "Расходы PRO v9.6 — Approved Dashboard TEST" --notes "Approved first reference dashboard with real finances and responsive charts, retained v9.5 slow rows-only KPI and v9.3 stable navigation. Financial data and SQLite logic are unchanged. On-device behavior remains to verify." --prerelease --latest=false
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: RashodyPRO-v96-Premium-Dashboard-TEST-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
          if-no-files-found: error
