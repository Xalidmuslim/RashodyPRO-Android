name: Maestro Android E2E
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.maestro/**'
      - 'www/**'
      - 'native/**'
      - 'scripts/**'
      - 'capacitor.config.json'
      - '.github/workflows/maestro-e2e.yml'

permissions:
  contents: read

concurrency:
  group: rashody-maestro-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: Assemble current Capacitor Android APK
        run: |
          set -euo pipefail
          python3 -m pip install --break-system-packages Pillow
          npm install
          npm run verify
          npx cap add android
          node scripts/prepare-android.mjs
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Install Maestro CLI
        run: |
          curl -fsSL https://get.maestro.mobile.dev | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test installed APK on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          script: |
            set -euo pipefail
            adb install -r android/app/build/outputs/apk/debug/app-debug.apk
            maestro test .maestro 2>&1 | tee maestro-output.log
      - name: Upload Maestro logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rashody-maestro-logs
          path: maestro-output.log
          if-no-files-found: ignore
