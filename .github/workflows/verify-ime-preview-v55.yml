name: Android IME v5.5 Preview QA
on:
  pull_request:
    branches: [main]
  push:
    branches: [fix/keyboard-sheet-matte-v55]
  workflow_dispatch:

jobs:
  verify-preview:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify core, UI and IME regressions
        run: |
          npm install
          npm run verify
      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER=$(find "${ANDROID_HOME}/cmdline-tools" -type f -name sdkmanager | head -n 1)
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0"
      - name: Generate isolated Android preview
        run: |
          python3 -m pip install --break-system-packages Pillow
          npx cap add android
          node scripts/prepare-android.mjs
          npx cap sync android
          node scripts/build-keyboard-preview-v55.mjs
      - name: Build and inspect APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Check install ID and size
        shell: bash
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "${ANDROID_HOME}/build-tools/36.0.0/aapt" dump badging "$APK" | grep "package: name='ru.rashody.pro.preview55'"
      - uses: actions/upload-artifact@v4
        with:
          name: Rashody-PRO-v55-IME-PREVIEW-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
