name: Android Side-by-side Preview
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  preview:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[publish-preview]') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Android SDK setup
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER=$(find "${ANDROID_HOME}/cmdline-tools" -type f -name sdkmanager | head -n 1)
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0"
      - name: Verify source and create safe preview variant
        run: |
          python3 -m pip install --break-system-packages Pillow
          npm install
          npm run verify
          npx cap add android
          node scripts/prepare-android.mjs
          npx cap sync android
          node scripts/build-preview-variant.mjs
          node scripts/verify-preview-variant.mjs
      - name: Build test APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Verify final APK package ID
        shell: bash
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "${ANDROID_HOME}/build-tools/36.0.0/aapt" dump badging "$APK" | grep "package: name='ru.rashody.pro.preview'"
      - name: Publish direct-download preview APK
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cp android/app/build/outputs/apk/debug/app-debug.apk RashodyPRO-PREVIEW-v5.4.apk
          gh release create deep-matte-preview-v5.4 "RashodyPRO-PREVIEW-v5.4.apk" \
            --target "$GITHUB_SHA" \
            --title "Расходы PRO 5.4 — отдельная проверочная версия" \
            --notes "ТЕСТОВАЯ УСТАНОВКА: отдельный package ID ru.rashody.pro.preview. Не заменяет основное приложение и не переносит его расходы. Нужна для проверки оформления и анимации, без удаления старой версии." \
            --prerelease
