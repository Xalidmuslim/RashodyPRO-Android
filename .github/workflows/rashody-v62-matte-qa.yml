name: Rashody PRO 6.2 Muted Matte and Frame QA
on:
  push:
    branches: [fix/rashody-v62-palette-overlap-2026-10-31]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Full regression suite including screenshot style contracts
        run: |
          set -euo pipefail
          python3 -m pip install --break-system-packages Pillow
          npm install
          npm run verify
      - name: Install Android build platform
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0"
      - name: Generate isolated Android 6.2 preview
        run: |
          set -euo pipefail
          npx cap add android
          node scripts/prepare-android.mjs
          npx cap sync android
          node scripts/build-matte-preview-v62.mjs
          node scripts/verify-matte-preview-v62.mjs
      - name: Build Android APK
        working-directory: android
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Verify APK identity, integrity and unchanged data sources
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | grep "package: name='ru.rashody.pro.preview62'"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | grep "versionName='6.2-sculptural-preview'"
          unzip -t "$APK" >/dev/null
          sha256sum "$APK"
          git diff --exit-code -- www native package.json
      - uses: actions/upload-artifact@v4
        with:
          name: RashodyPRO-v62-Muted-Matte-TEST-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Publish verified APK for direct mobile download
        if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[publish-v62]') }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          apk=android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$apk"
          cp "$apk" RashodyPRO-Muted-Matte-v6.2-TEST.apk
          gh release create rashody-muted-matte-v6.2-test RashodyPRO-Muted-Matte-v6.2-TEST.apk \
            --target "$GITHUB_SHA" \
            --title "Расходы PRO — Sculptural Matte v6.2 (тест)" \
            --notes "Исправлены яркие SVG диаграммы, столкновения вложенных рамок, перекрытие навигации и верхний край редактора Android. Отдельный пакет ru.rashody.pro.preview62; основное приложение и его данные не меняются. Debug APK — для визуальной проверки на Android." \
            --prerelease --latest=false
