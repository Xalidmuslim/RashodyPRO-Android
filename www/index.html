/* Clean layout stylesheet: no historical themes, textures, gradients or 3D effects. */
:root{--bg:#fff;--surface:#fff;--surface-2:#f5f5f5;--surface-3:#eee;--ink:#222;--ink-2:#333;--muted:#666;--border:#dedede;--green:#333;--green-hi:#222;--green-pale:#efefef;--danger:#444;--danger-pale:#f1f1f1;--orange:#777;--ring:#d8d8d8;--shadow:none;--blur:#fff;--font:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;--clay:#777;--clay-wash:#f2f2f2;--blue:#555;--blue-wash:#f2f2f2;--olive:#777;--olive-wash:#eee;--lavender:#888;--lavender-wash:#eee;color-scheme:light}
*{box-sizing:border-box}
html{scroll-behavior:smooth;overscroll-behavior-x:none}
body{margin:0;font-family:var(--font);font-size:calc(14px * var(--font-scale,1));letter-spacing:-.012em;overscroll-behavior-x:none}
button{font:inherit;cursor:pointer}
input{font:inherit}
select{font:inherit}
textarea{font:inherit}
button:disabled{cursor:not-allowed;opacity:.48}
button:focus-visible{outline-offset:2px}
input:focus-visible{outline-offset:2px}
select:focus-visible{outline-offset:2px}
textarea:focus-visible{outline-offset:2px}
svg{display:block}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
h1{margin-top:0;font-weight:800;letter-spacing:-.045em;font-size:calc(31px * var(--font-scale,1));margin:0}
h2{margin-top:0;font-size:calc(17px * var(--font-scale,1));letter-spacing:-.025em;margin:0;font-weight:800}
h3{margin-top:0;font-size:calc(14px * var(--font-scale,1));margin:0;font-weight:800}
p{margin-top:0}
.small{font-size:calc(12px * var(--font-scale,1))}
.sub{font-size:calc(12px * var(--font-scale,1));margin-top:4px}
.truncate{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.shell{max-width:1480px;margin:0 auto;display:flex;min-height:100dvh;padding:24px;gap:24px;min-width:0}
.sidebar{width:232px;flex:0 0 232px;padding:22px 12px 18px 0;display:flex;flex-direction:column;position:sticky;top:24px;height:calc(100dvh - 48px)}
.brand{display:flex;align-items:center;gap:12px;padding:12px 14px 38px}
.brand-mark{width:43px;height:43px;display:grid;place-items:center;border-radius:15px}
.brand-label{font-size:calc(19px * var(--font-scale,1));font-weight:800;letter-spacing:-.055em}
.brand-tag{font-size:calc(10px * var(--font-scale,1));letter-spacing:.025em;margin-top:2px}
.navlist{display:grid;gap:6px}
.navitem{display:flex;align-items:center;gap:14px;padding:14px 16px;text-align:left;font-weight:700;border-radius:14px}
.navitem svg{flex:none}
.sidebar-foot{margin-top:auto;padding:20px 14px;font-size:calc(11px * var(--font-scale,1));line-height:1.6}
.sidebar-foot svg{display:inline-block;vertical-align:middle}
.workspace{flex:1;min-width:0;max-width:1120px;padding:0 0 52px;padding-bottom:0!important;padding-top:0}
.topbar{display:flex;justify-content:space-between;align-items:center;padding:14px 4px 28px;gap:15px;padding-bottom:19px;padding-top:18px}
.topline{font-size:calc(11px * var(--font-scale));font-weight:700;margin-bottom:6px}
.topbar-right{display:flex;gap:9px;align-items:center}
.icon-btn{width:38px;height:38px;display:grid;place-items:center;border-radius:12px}
.primary-btn{border-radius:18px;padding:12px 17px;font-size:calc(13px * var(--font-scale,1));font-weight:800;display:inline-flex;align-items:center;justify-content:center;gap:9px;min-height:44px}
.secondary-btn{border-radius:18px;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 15px;font-weight:700;min-height:43px}
.ghost-btn{font-weight:800;font-size:calc(12px * var(--font-scale,1));padding:10px}
.danger-btn{font-weight:800}
.section{margin-top:18px}
.section-heading{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px}
.section-caption{font-size:calc(12px * var(--font-scale,1));margin-top:5px}
.panel{border-radius:20px;padding:21px;min-width:0}
.pill{display:inline-flex;align-items:center;gap:5px;padding:6px 9px;border-radius:100px;font-size:calc(11px * var(--font-scale,1));font-weight:800}
.chart-flex{display:flex;align-items:center;gap:16px;margin-top:0;max-width:none;margin:0;min-width:0;width:100%}
.ring{width:196px;height:196px;border-radius:50%;position:relative;flex:none;display:grid;place-items:center;cursor:default;isolation:isolate}
.ring-inner{height:128px;width:128px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;z-index:1;pointer-events:none;padding:3px}
.ring-inner span{font-size:calc(11px * var(--font-scale,1))}
.ring-inner b{font-size:calc(18px * var(--font-scale,1));letter-spacing:-.04em;margin-top:4px}
.legend{min-width:0;flex:1;display:grid;gap:9px}
.legend-line{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:calc(12px * var(--font-scale,1));width:100%;border-radius:16px;padding:9px 11px;text-align:left;min-height:0}
.legend-name{display:flex;align-items:center;gap:9px;min-width:0}
.legend-dot{width:9px;height:9px;border-radius:3px;flex:none}
.legend-line b{white-space:nowrap;font-size:calc(13px * var(--font-scale))}
.category-icon{width:42px;height:42px;display:grid;place-items:center;border-radius:14px;flex:none}
.separator{margin:20px 0 8px}
.record-row{display:flex;align-items:center;gap:12px;padding:13px 0;width:100%;text-align:left}
.record-main{flex:1;min-width:0}
.record-title{font-size:calc(14px * var(--font-scale));font-weight:800}
.record-meta{font-size:calc(12px * var(--font-scale));margin-top:5px}
.record-amount{font-size:calc(14px * var(--font-scale,1));font-weight:800}
.record-end{display:flex;align-items:center;gap:14px}
.day-label{display:flex;justify-content:space-between;font-size:calc(11px * var(--font-scale,1));font-weight:800;margin:21px 2px 5px}
.day-label:first-child{margin-top:0}
.record-list{padding:3px 18px;border-radius:18px}
.record-list .record-row{padding:12px 0}
.empty{padding:36px 15px;text-align:center;font-size:calc(12px * var(--font-scale,1));line-height:1.8}
.empty-icon{width:62px;height:62px;border-radius:21px;margin:0 auto 17px;display:grid;place-items:center}
.empty strong{display:block;font-size:calc(15px * var(--font-scale,1));margin-bottom:5px}
.empty .secondary-btn{margin-top:14px}
.page-intro{display:flex;align-items:end;justify-content:space-between;gap:15px;margin:4px 0 23px}
.page-intro h1{font-size:calc(27px * var(--font-scale,1))}
.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:18px}
.search{display:flex;gap:9px;align-items:center;border-radius:18px;padding:0 13px;min-height:44px;flex:1;min-width:180px}
.search input{width:100%;min-width:0;padding:11px 0}
.filter-group{display:flex;gap:4px;padding:4px;border-radius:18px}
.filter-group button{padding:8px 12px;border-radius:10px;font-size:calc(11px * var(--font-scale,1));font-weight:800}
.filter-select{border-radius:18px;padding:10px 13px;min-height:44px;max-width:170px;font-size:calc(12px * var(--font-scale,1));font-weight:700}
.checklabel{display:flex;align-items:center;gap:8px;font-size:calc(12px * var(--font-scale,1));font-weight:700;cursor:pointer}
.checklabel input{width:17px;height:17px}
.summary-strip{padding:16px 20px;display:flex;gap:24px;align-items:center;flex-wrap:wrap;border-radius:16px;margin-bottom:16px}
.summary-strip b{font-size:calc(13px * var(--font-scale,1))}

/* EXPENSES PRO 4 · new design system */
:root{--bg:#F6F2EB;--surface:#FFFCF7;--surface-2:#F8F3EC;--surface-3:#EEE7DE;--ink:#17232E;--ink-2:#35424B;--muted:#6F757D;--border:#E8E0D6;--green:#267783;--green-hi:#174D5B;--green-pale:#E1F2F1;--danger:#D8614B;--danger-pale:#FDE7E1;--orange:#EF8465;--ring:#EDE5D9;--shadow:0 11px 24px rgba(86,64,42,.13),0 2px 2px rgba(106,83,60,.07);--blur:#FFFAF4;--clay:#F47D5E;--clay-wash:#FDE4DA;--blue:#315765;--blue-wash:#DEEEF4;--olive:#48A7A7;--olive-wash:#DDF1EF;--lavender:#8A85AC;--lavender-wash:#ECE8F4;color-scheme:light}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;letter-spacing:-.022em}
body::before,body::after{content:none!important}
*{animation:none!important;transition:transform .16s ease,box-shadow .16s ease,background-color .16s ease}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid #267783;outline-offset:3px}
.panel,.metric,.compare-metric,.insight-tile,.legend-line,.month-switcher,.mobile-nav,.sheet,.summary-strip,.record-list,.period-controls,.search,.filter-group,.filter-select,.setting-select,.font-toggle,.type-switch,.category-row,.setting-row,.week-stat,.week-day,.calendar-selected{background:var(--surface);border:1px solid rgba(255,255,255,.78);box-shadow:var(--shadow)}
body .panel,body .metric,body .compare-metric,body .insight-tile,body .month-switcher,body .mobile-nav{border-radius:26px}
.panel{padding:21px;background:#FFFBF5}
.shell{max-width:1340px;gap:25px}
.workspace{padding-bottom:0!important;min-width:0}
h1,h2,h3,.brand-label{color:#16222C;letter-spacing:-.044em}
.section-heading h2{font-size:calc(20px * var(--font-scale,1))}
.sidebar{width:212px;flex-basis:212px}
.brand-mark{background:#F47D5E;color:#fff;border-radius:16px;box-shadow:0 8px 14px rgba(235,112,84,.22)}
.brand-label span{color:#F47D5E}
.navitem{border-radius:18px;color:#59616A;gap:11px}
.navitem.active{background:#315765;color:white;box-shadow:0 9px 14px rgba(27,72,84,.18)}
.navitem.active svg{color:white}
.topbar.dashboard-topbar{display:none!important}
.topbar.subpage-topbar{padding:10px 0 9px}
.topbar .topline{display:none}
.topbar.subpage-topbar h1{font-size:calc(22px * var(--font-scale,1))}
.topbar.subpage-topbar:has(+ #page .analytics-hero-title) .topbar-heading h1{display:none}
.topbar.subpage-topbar:has(+ #page .analytics-hero-title){padding-bottom:0}
.topbar.subpage-topbar:has(+ #page .analytics-hero-title) .screen-back{background:#FFF9F1;border-radius:16px}
.icon-btn,.secondary-btn,.ghost-btn,.today-btn,.repeat-inline,.subtle-add{border:1px solid rgba(255,255,255,.83);background:#FFFBF4;color:#35424B;box-shadow:0 7px 13px rgba(97,77,55,.12),inset 0 1px rgba(255,255,255,.85)}
.icon-btn{border-radius:17px;width:44px;height:44px}
.icon-btn:active,.week-day:active,.primary-btn:active,.mobile-nav button:active{transform:translateY(2px)}
.primary-btn,.subtle-add{background:#F47D5E;color:#fff;border:1px solid #ED7153;box-shadow:0 9px 15px rgba(231,103,75,.23);border-radius:17px}
.ghost-btn{border-radius:16px;padding:9px 12px;font-weight:750;color:#315765}
.secondary-btn,.repeat-inline{border-radius:17px;padding:11px 14px}
.small,.sub,.section-caption,.record-meta,.setting-expl{color:var(--muted)}
.record-row{border-bottom:1px solid #EFE7DF}
.record-row:last-child{border-bottom:none}

/* Calendar, week tiles, dashboard */
.calendar-shell{margin-bottom:15px;max-width:100%}
.calendar-title-row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:13px;padding:0 3px}
.calendar-title-row h1{font-size:clamp(25px,3vw,36px);font-weight:850}
.week-arrows{display:flex;gap:10px}
.week-arrows .icon-btn{width:43px;height:43px;background:#FFFAF3}
.week-strip{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:11px}
.week-day,.week-day.has-expense{background:#FFFAF4;border:1px solid #FFFEFA;box-shadow:0 8px 14px rgba(86,65,42,.11),inset 0 1px 0 #fff;display:flex;flex-direction:column;align-items:center;justify-content:space-around;min-height:90px;padding:11px 2px;border-radius:22px;text-align:center}
.week-day-name{font-size:calc(12px * var(--font-scale,1));color:#7B7880;font-weight:650;text-transform:none}

.week-day-dot{height:8px;width:8px;border-radius:50%;background:#DED2C3;display:block;margin-top:3px}
.week-day.has-expense .week-day-dot{background:#ED8265}
.week-day.is-active:not(.focus-day){border:1px solid #F1B5A1}
.week-day.focus-day,.week-day.focus-day.has-expense{background:#315765;color:#fff;border-color:#254D59;box-shadow:0 10px 17px rgba(35,78,91,.25),inset 0 1px rgba(255,255,255,.16)}
.week-day.focus-day .week-day-name,.week-day.focus-day .week-day-date{color:#fff}
.week-day.focus-day .week-day-dot{background:#fff}
.trend-cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:15px}
.trend-card{display:flex;flex-direction:column;align-items:flex-start;gap:6px;border-radius:24px;padding:17px 17px 16px;color:#fff;min-height:146px;box-shadow:0 11px 17px rgba(101,73,47,.14),inset 0 1px rgba(255,255,255,.22);position:relative;overflow:hidden}
.trend-card::after,.color-category-card::after{content:'';position:absolute;width:79px;height:79px;right:-40px;bottom:-45px;border:1px solid rgba(255,255,255,.22);border-radius:50%;pointer-events:none}
.trend-card.coral{background:#F47D5E}.trend-card.teal{background:#48A7A7}.trend-card.amber{background:#EEB34F}
.trend-icon{width:43px;height:43px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.23);border:1px solid rgba(255,255,255,.35);box-shadow:0 5px 9px rgba(0,0,0,.11),inset 0 1px rgba(255,255,255,.25);margin-bottom:auto}
.trend-card strong{font-size:clamp(15px,3.8vw,23px);font-weight:850;letter-spacing:-.06em;line-height:1.06}
.trend-card>span:last-child{font-size:calc(12px * var(--font-scale,1));font-weight:650;line-height:1.18}
.feature-day{background:#FFF9F1;border:1px solid #fff;position:relative;overflow:hidden;border-radius:28px;box-shadow:var(--shadow);padding:24px 24px 23px;min-height:235px;margin-bottom:15px;display:flex;align-items:stretch}
.feature-copy{position:relative;z-index:2;max-width:64%;display:flex;flex-direction:column;align-items:flex-start;min-width:0}
.feature-copy .eyebrow{font-size:calc(10px * var(--font-scale,1));letter-spacing:.17em;font-weight:900;color:#7E7974}
.feature-copy h2{font-size:calc(22px * var(--font-scale,1));margin:7px 0 3px;text-transform:capitalize;line-height:1.13}
.feature-amount{font-size:clamp(31px,4.7vw,50px);font-weight:900;letter-spacing:-.055em;margin:4px 0;color:#132430}
.feature-copy p{color:#797B80;font-size:calc(13px * var(--font-scale,1));line-height:1.45;margin:0 0 8px;max-width:240px}
.feature-income{font-size:calc(10px * var(--font-scale,1));color:#267783;margin:1px 0 7px}
.feature-link{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:#fffaf2;color:#25343E;border:1px solid #fff;border-radius:999px;box-shadow:0 9px 16px rgba(102,77,48,.15);font-weight:800;padding:11px 14px;margin-top:auto;font-size:calc(12px * var(--font-scale,1))}
.feature-art{position:absolute;right:0;top:0;bottom:0;width:47%;pointer-events:none;overflow:hidden}
.art-back{position:absolute;right:-14%;top:-20%;width:90%;height:155%;border-radius:45% 0 0 50%;background:#F9BA57}
.art-ring{position:absolute;width:142px;height:142px;left:-2%;top:23%;border-radius:50%;background:conic-gradient(#F47D5E 0 33%,#48A7A7 33% 58%,#E8DCC8 58% 100%);box-shadow:7px 12px 17px rgba(111,70,39,.26),inset 0 2px 0 rgba(255,255,255,.3)}
.art-ring::after{content:'';position:absolute;inset:36px;background:#FCF8F0;border-radius:50%;box-shadow:inset 7px 7px 11px rgba(133,97,61,.13)}
.art-dot{position:absolute;border-radius:50%;box-shadow:7px 10px 14px rgba(72,82,78,.19)}

const DEMO_MONTH_ID_PREFIX='rashody-month-demo-v1-';
function buildMonthlySample(sampleMonth,includeIncome){
 const start=new Date(sampleMonth.getFullYear(),sampleMonth.getMonth(),1);
 const year=start.getFullYear(),monthIndex=start.getMonth();
 const numberOfDays=new Date(year,monthIndex+1,0).getDate();
 const plans=[
  ['food',540,'Покупки продуктов'],['transport',370,'Транспорт'],
  ['cafe',620,'Кафе'],['home',980,'Дом и счета'],
  ['health',460,'Аптека'],['fun',810,'Отдых'],
  ['shop',1250,'Покупки'],['other',310,'Повседневные расходы']
 ];
 const result=[];
 const add=(day,index,type,category,amount,note)=>{
  const date=dateLocal(new Date(year,monthIndex,day));
  result.push({id:DEMO_MONTH_ID_PREFIX+date+'-'+index,type,category,amount,
   note:'Образец · '+note,date,time:index===0?'12:00':index===1?'18:30':'09:00'});
 };
 for(let day=1;day<=numberOfDays;day++){
  const p=plans[(day-1)%plans.length];
  add(day,0,'expense',p[0],p[1]+(day%5)*70,p[2]);
  if(day%3===0||day%7===0){
   const extra=plans[(day+3)%plans.length];
   add(day,1,'expense',extra[0],extra[1]+(day%4)*90,extra[2]);
  }
 }
 if(includeIncome){
  add(Math.min(5,numberOfDays),2,'income','salary',78500,'Зарплата');
  add(Math.min(20,numberOfDays),3,'income','sidejob',12000,'Подработка');
 }
 return result;
}
function monthlyDemoEntries(){

function withStorageTimeout(task,ms,label){
 let timer;
 return Promise.race([Promise.resolve(task),new Promise((_,reject)=>{timer=setTimeout(()=>reject(new Error(label+' — превышено время ожидания')),ms)})]).finally(()=>clearTimeout(timer));
}
async function bootstrap(){

  // APK reads SQLite first. Never wait for the WebView's IndexedDB on the native path.
  try{
   const plugin=financeNative();
   if(!plugin)throw new Error('FinanceStorage plugin отсутствует');
   const result=await withStorageTimeout(plugin.readSnapshot(),4500,'Чтение Android SQLite');
   rawNative=result?.snapshot??null;
  }catch(e){nativeReadable=false;console.error('Не удалось прочитать Android SQLite:',e)}
 }else{
  try{rawDB=await withStorageTimeout(loadBackupDB(),3500,'Чтение IndexedDB')}catch(e){dbReadable=false;console.warn('IndexedDB недоступна:',e)}
 }

 // Preserve verified SQLite data as authoritative. Do not overwrite a damaged or unreadable native DB.
 const chosen=(nativeAndroid&&validNative)?validNative:snapshotChoice(validLocal,validDB);
 if(nativeAndroid&&(!nativeReadable||(rawNative!==null&&!validNative)))recoveryLocked=true;
 if(chosen){data=chosen.state;storageRevision=chosen.revision}
 else if(rawLocal!=null||rawDB!=null||rawNative!=null){
  recoveryLocked=true;
  try{data=initData()}catch(e){data={transactions:[],settings:F.normalizeSettings({}),categories:mergeCategories([])}}
 }else{
  try{data=initData()}catch(e){data={transactions:[],settings:F.normalizeSettings({}),categories:mergeCategories([])}}
 }
 if(!data.transactions.some(t=>t.type==='expense'&&t.date?.startsWith(dateLocal().slice(0,7)))){

 }
 const notice=document.getElementById('storageBanner'),content=document.getElementById('page');
 if(notice&&content&&notice.parentElement!==content.parentElement)content.before(notice);
 initNeutralAppearance();applyFontScale();try{initNavigation()}catch(e){console.warn("Навигация Android недоступна:",e)}try{registerAndroidBack()}catch(e){console.warn("Системная кнопка Назад:",e)}render();
 if(recoveryLocked){

 }else await persist();
}
