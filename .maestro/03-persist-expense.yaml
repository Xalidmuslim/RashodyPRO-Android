appId: ru.rashody.pro
name: Rashody PRO - verify saved expense and restart
tags:
  - regression
---
- launchApp:
    clearState: true
- assertVisible: "Обзор"
- tapOn: "Добавить операцию"
- assertVisible: "Новый расход"
- tapOn: "500"
- tapOn: "Добавить операцию"
- takeScreenshot: expense-after-save
- assertVisible: "Обзор"
- tapOn: "Операции"
- takeScreenshot: expense-history-before-restart
- assertVisible: "500"
- stopApp
- launchApp
- tapOn: "Операции"
- takeScreenshot: expense-history-after-restart
- assertVisible: "500"
